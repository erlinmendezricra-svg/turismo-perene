<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fauna y Saberes - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { overflow: hidden; }
    
    .boton-volver {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    
    .selector-idioma {
      position: absolute;
      top: 15px;
      right: 60px;
      z-index: 100;
      background: white;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    
    .selector-idioma button {
      border: none;
      background: transparent;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .selector-idioma button.activo {
      background: #006633;
      color: white;
    }
    
    /* 🐾 MENÚ DE ANIMALES */
    .menu-animales {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 0 10px;
    }
    
    .menu-animales button {
      background: #006633;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    
    .menu-animales button.activo {
      background: #f9b823;
      color: #000;
    }
    
    .menu-animales button:hover {
      transform: scale(1.05);
    }
    
    .portal-luz {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(76,175,80,0.5), transparent 70%);
      animation: flotar 3s ease-in-out infinite;
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    
    @keyframes flotar {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-15px) scale(1.15); opacity: 0.9; }
    }
    
    .tarjeta-info {
      position: absolute;
      top: 70px;
      right: 15px;
      background: rgba(255,255,255,0.95);
      padding: 15px 40px 15px 20px;
      border-radius: 12px;
      max-width: 280px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      z-index: 80;
      display: none;
    }
    
    .tarjeta-info.mostrar {
      display: block;
    }
    
    .tarjeta-info h3 {
      color: #006633;
      margin-bottom: 8px;
      font-size: 16px;
    }
    
    .tarjeta-info p {
      font-size: 14px;
      line-height: 1.5;
    }
    
    .cerrar-x {
      position: absolute;
      top: 8px;
      right: 10px;
      background: #f0f0f0;
      border: none;
      font-size: 20px;
      color: #666;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    
    .cerrar-x:hover {
      background: #e0e0e0;
    }
    
    .caja-idea {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 12px 15px;
      border-radius: 12px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.15);
      z-index: 90;
      width: 90%;
      max-width: 300px;
    }
    
    .caja-idea strong {
      color: #006633;
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    
    .caja-idea textarea {
      width: 100%;
      height: 45px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
      resize: none;
      font-size: 13px;
    }
    
    .btn-enviar {
      background: #f9b823;
      color: #000;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    
    .btn-enviar:hover {
      background: #e8a900;
    }
  </style>
</head>
<body>

  <a href="index.html" class="boton-volver">← Volver</a>

  <div class="selector-idioma">
    <button class="activo" onclick="cambiarIdioma('es')">🇪🇸</button>
    <button onclick="cambiarIdioma('ash')">🌿</button>
    <button onclick="cambiarIdioma('en')">🇬🇧</button>
  </div>

  <!-- 🌿 Portal de Información de Plantas y Árboles -->
  <div class="portal-luz" style="top: 40%; left: 50%; transform: translate(-50%, -50%);" onclick="mostrarInfo()">🌿</div>

  <!-- 🐾 MENÚ DE ANIMALES -->
  <div class="menu-animales">
    <button class="activo" onclick="seleccionarAnimal('caiman')">🐊 Caimán</button>
    <button onclick="seleccionarAnimal('mono')">🐒 Mono Choro</button>
    <button onclick="seleccionarAnimal('jaguar')">🐅 Jaguar</button>
    <button onclick="seleccionarAnimal('tucan')">🐦 Tucán</button>
    <button onclick="seleccionarAnimal('tapir')">🐴 Tapir</button>
  </div>

  <!-- 📋 Tarjeta de información -->
  <div class="tarjeta-info" id="tarjetaInfo">
    <button class="cerrar-x" onclick="cerrarInfo()">&times;</button>
    <h3 id="tituloInfo">Selecciona un animal</h3>
    <p id="textoInfo">Toca un botón abajo para conocer a los animales de nuestra selva 🌿</p>
  </div>

  <!-- 💚 Caja de ideas -->
  <div class="caja-idea">
    <strong>💡 Tu idea de conservación</strong>
    <textarea id="miIdea" placeholder="Escribe aquí tu idea..."></textarea>
    <button class="btn-enviar" onclick="enviarIdea()">➤ Enviar mi idea</button>
  </div>

  <!-- 📷 Escena de Realidad Aumentada -->
  <a-scene 
    arjs="sourceType: webcam;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <!-- Aquí irán tus modelos 3D -->
      <a-asset-item id="caiman" src="caiman.glb"></a-asset-item>
      <a-asset-item id="mono" src="mono-choro.glb"></a-asset-item>
      <a-asset-item id="jaguar" src="jaguar.glb"></a-asset-item>
      <a-asset-item id="tucan" src="tucan.glb"></a-asset-item>
      <a-asset-item id="tapir" src="tapir.glb"></a-asset-item>
    </a-assets>

    <!-- Modelos de animales (inicialmente ocultos) -->
    <a-entity id="animal-actual" position="0 0 -3" scale="0.8 0.8 0.8"></a-entity>
    
    <a-entity camera></a-entity>
    <a-light type="ambient" intensity="1.5"></a-light>
  </a-scene>

  <script>
    // 📝 Información de cada animal
    const infoAnimales = {
      caiman: {
        titulo: "🐊 Caimán Negro",
        descripcion: "Vive en ríos y lagunas como la de Boca Tigre. Es un depredador que mantiene el equilibrio del ecosistema. ¡No es agresivo con las personas si lo respetamos!"
      },
      mono: {
        titulo: "🐒 Mono Choro",
        descripcion: "De cola amarilla y pelaje oscuro. Vive en las copas de los árboles. Ayuda a dispersar semillas: ¡come frutas y deja caer las semillas en otros lugares!"
      },
      jaguar: {
        titulo: "🐅 Jaguar — El Rey de la Selva",
        descripcion: "El felino más grande de América. Es símbolo de fuerza y equilibrio. Donde hay jaguares, hay bosques sanos. Está protegido: ¡no debemos cazarlo!"
      },
      tucan: {
        titulo: "🐦 Tucán",
        descripcion: "Con su pico colorido come frutas y dispersa las semillas de los árboles. Es el jardinero del bosque. Su canto anuncia que estamos en una selva viva."
      },
      tapir: {
        titulo: "🐴 Tapir — El Gigante de la Selva",
        descripcion: "El mamífero más grande de nuestra selva. Camina por senderos abiertos y come plantas y frutos. Es una especie antigua y muy importante para el bosque."
      }
    };

    // 🌿 Información de plantas y árboles
    const infoNaturaleza = {
      es: {
        titulo: "🌿 Plantas y Árboles de Perené",
        texto: "<strong>🌱 Muña:</strong> Ayuda al estómago y resfriados.<br><br><strong>🌲 Uña de Gato:</strong> Fortalece las articulaciones.<br><br><strong>🟡 Cedro:</strong> Madera valiosa, protegida.<br><br><strong>🟠 Lupuna:</strong> El gigante del bosque, más de 40m de altura."
      }
    };

    let animalActual = null;

    // 🐾 Cambiar de animal
    function seleccionarAnimal(nombre) {
      // Resaltar botón activo
      document.querySelectorAll('.menu-animales button').forEach(b => b.classList.remove('activo'));
      event.target.classList.add('activo');
      
      // Mostrar información
      document.getElementById('tituloInfo').textContent = infoAnimales[nombre].titulo;
      document.getElementById('textoInfo').innerHTML = infoAnimales[nombre].descripcion;
      document.getElementById('tarjetaInfo').classList.add('mostrar');
      
      // Cargar modelo 3D
      const animal = document.getElementById('animal-actual');
      animal.setAttribute('gltf-model', `#${nombre}`);
      animalActual = nombre;
    }

    // 🌿 Mostrar info de plantas y árboles
    function mostrarInfo() {
      document.getElementById('tituloInfo').textContent = infoNaturaleza.es.titulo;
      document.getElementById('textoInfo').innerHTML = infoNaturaleza.es.texto;
      document.getElementById('tarjetaInfo').classList.add('mostrar');
    }

    // ❌ Cerrar tarjeta
    function cerrarInfo() {
      document.getElementById('tarjetaInfo').classList.remove('mostrar');
    }

    // 💚 Enviar idea
    function enviarIdea() {
      const idea = document.getElementById('miIdea').value;
      if (idea.trim() === '') {
        alert('✍️ Escribe algo antes de enviar');
        return;
      }
      alert('✅ ¡Gracias por tu idea! 💚\n\nAyudas a cuidar la fauna de Perené.');
      document.getElementById('miIdea').value = '';
    }

    // 🌍 Idiomas
    function cambiarIdioma(idioma) {
      idiomaActual = idioma;
      document.querySelectorAll('.selector-idioma button').forEach(b => b.classList.remove('activo'));
      event.target.classList.add('activo');
    }

    // ✨ Animación suave del animal
    let tiempo = 0;
    function animarAnimal() {
      tiempo += 0.02;
      const animal = document.getElementById('animal-actual');
      if (animal && animal.getAttribute('gltf-model')) {
        const y = Math.sin(tiempo * 0.5) * 0.1 + 0;
        animal.setAttribute('position', `0 ${y} -3`);
        animal.setAttribute('rotation', `0 ${tiempo * 5} 0`);
      }
      requestAnimationFrame(animarAnimal);
    }
    animarAnimal();
  </script>

</body>
</html>
